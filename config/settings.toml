[broker]
provider = "alpaca"
mode = "paper"

[agent]
paper_cycle_seconds = 300
live_cycle_seconds = 1800
run_on_weekends_for_crypto = true
execute_orders = true
max_orders_per_cycle = 3
paper_max_entry_orders_per_day = 12
paper_max_total_orders_per_day = 24
live_max_entry_orders_per_day = 3
live_max_total_orders_per_day = 6

[audit]
enabled = true
database_path = "data/trading_agent_paper_clean_20260602.sqlite3"

[position_manager]
enabled = true
stop_loss_pct = 6.0
take_profit_pct = 12.0
trailing_stop_pct = 8.0
max_holding_days = 20
manage_options = true
option_stop_loss_pct = 40.0
option_take_profit_pct = 80.0

[risk]
max_risk_per_trade_pct = 2.0
max_daily_loss_pct = 3.0
max_position_pct = 12.0
max_crypto_position_pct = 10.0
max_options_premium_pct = 2.0
min_cash_buffer_pct = 5.0
max_entry_slippage_pct = 0.5

[strategy]
symbols = ["SPY", "QQQ", "AAPL", "MSFT", "NVDA", "BTC/USD", "ETH/USD"]
enabled = [
  "equity_momentum",
  "crypto_momentum",
  "covered_call",
  "cash_secured_put",
  "long_call",
  "long_put",
  "call_debit_spread",
  "put_debit_spread"
]
allow_options = true
allow_crypto = true
allow_short = true
min_signal_score = 70.0

[screener]
enabled = true
max_candidates = 10
max_crypto_candidates = 3
universes = ["nasdaq100", "sp500_core", "crypto_major"]
min_price = 5.0
min_avg_dollar_volume = 25000000.0
max_realized_volatility_pct = 90.0
min_trend_score = 45.0

[catalyst]
enabled = true
min_trade_score = 65.0
min_entry_score = 80.0
score_weight = 0.35
max_volatility_pct = 75.0
generate_entry_candidates = true
block_low_confidence = true
block_rumor_only = true
block_high_event_risk = true
require_medium_confidence_for_options = true

[day_trading]
enabled = false
paper_only = true
max_trades_per_day = 3
risk_per_trade_pct = 0.25
max_position_pct = 4.0
max_daily_loss_pct = 1.0
max_position_minutes = 120
force_exit_before_close_minutes = 15
min_catalyst_score = 65.0
min_intraday_score = 70.0
min_combined_score = 80.0
exit_intraday_score = 45.0
stop_loss_pct = 1.0
take_profit_pct = 2.0
trailing_stop_pct = 1.0
min_relative_volume = 1.2
max_spread_pct = 0.25

[research]
news_headline_limit = 8
news_cache_enabled = true
news_cache_database_path = "data/news_cache.sqlite3"
news_cache_ttl_seconds = 1800
marketaux_daily_call_limit = 90
alpaca_news_daily_call_limit = 0
yahoo_news_daily_call_limit = 0
sec_companyfacts_enabled = true
crypto_research_enabled = true
crypto_onchain_enabled = false
crypto_onchain_provider = ""
crypto_exchange_flows_enabled = false
