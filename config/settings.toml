[broker]
provider = "alpaca"
mode = "paper"

[agent]
paper_cycle_seconds = 300
live_cycle_seconds = 1800
run_on_weekends_for_crypto = true
execute_orders = true
max_orders_per_cycle = 3
paper_max_entry_orders_per_day = 12
paper_max_total_orders_per_day = 24
live_max_entry_orders_per_day = 3
live_max_total_orders_per_day = 6

[market_data]
# Consolidated (SIP) daily bars, split/dividend adjusted, ~290 bars of history.
# IEX alone carries ~3-6% of volume and its daily closes are not official closes.
historical_feed = "sip"
sip_delay_minutes = 16
daily_lookback_days = 420
adjustment = "all"

[audit]
enabled = true
database_path = "data/trading_agent_paper_clean_20260624.sqlite3"

[position_manager]
enabled = true
# Swing equity longs exit on one ratcheting ATR stop held at the broker as a GTC
# order: chandelier trail at 2.5 ATR below the peak, raised to breakeven once the
# peak is 1.5 ATR above entry, no fixed take-profit. Chosen from a 4.9-year
# backtest of the agent's own entry signals (Nov 2026): vs the old 6%/8%/profit-
# lock rules at equal sizing, profit factor 1.17 -> 1.41 and average loss
# -4.1% -> -2.8%. The breakeven step mattered most; without it results were worst.
equity_exit_mode = "atr"
breakeven_trigger_atr = 1.5
chandelier_atr_multiple = 2.5
stop_ratchet_min_atr = 0.1
# Hard cap (also the legacy-rule stop for positions without an entry ATR).
stop_loss_pct = 12.0
take_profit_pct = 8.0
trailing_stop_pct = 8.0
max_holding_days = 20
max_days_without_profit = 7
profit_lock_enabled = true
profit_lock_steps = [
  { profit_pct = 2.0, lock_pct = 0.75 },
  { profit_pct = 3.0, lock_pct = 2.0 },
  { profit_pct = 5.0, lock_pct = 3.5 },
  { profit_pct = 7.0, lock_pct = 5.5 }
]
manage_options = true
option_stop_loss_pct = 40.0
option_take_profit_pct = 50.0

[risk]
# With real ATR stops, risk-based sizing binds: a 3-ATR stop of ~6% sizes at
# 12.5% (cap 12%); a volatile name with a 10% stop sizes at 7.5%. At 2% every
# trade hit the 12% cap regardless of volatility.
max_risk_per_trade_pct = 0.75
max_daily_loss_pct = 3.0
max_position_pct = 12.0
max_crypto_position_pct = 10.0
max_options_premium_pct = 2.0
min_cash_buffer_pct = 5.0
max_entry_slippage_pct = 0.5
# Portfolio circuit breaker: halt NEW entries when equity is this far below its
# trailing peak (0 disables). Stops averaging into a sustained drawdown.
max_drawdown_halt_pct = 8.0
drawdown_lookback_days = 14
# Cap aggregate exposure to one correlated cluster (default cluster = megacap
# AI/semis). 0 disables. Prevents loading correlated names that fall together.
max_correlated_exposure_pct = 25.0

[regime]
# Only open new equity/ETF/option longs when the benchmark is above its trend
# SMA. Crypto keeps its own regime logic. Set enabled=false to disable the gate.
enabled = true
benchmark_symbol = "SPY"
sma_period = 50
block_equity_entries_in_downtrend = true
# Day trades use intraday signals, so the daily-SMA gate skips them by default.
apply_to_day_trades = false

[execution]
# Options are illiquid / badly quoted after hours and in the opening auction.
# Price and trade options only during regular hours, skipping the open/close
# buffers, and reject quotes that are implausibly wide.
market_hours_only_options = true
open_buffer_minutes = 15
close_buffer_minutes = 10
max_option_spread_pct = 25.0

[strategy]
symbols = ["SPY", "QQQ", "AAPL", "MSFT", "NVDA", "BTC/USD", "ETH/USD"]
# Premium-buying option strategies (long_call, long_put, call_debit_spread,
# put_debit_spread) are disabled: 0 wins in 11 round trips across two paper
# accounts (-$6,130 realized). They pay wide option quotes both ways and the
# 40% premium stop turns quote noise into realized losses. The remaining
# option strategies SELL premium, which sits on the profitable side of the
# same wide quotes.
# Swing equity momentum re-enabled after the data-layer, catalyst and stop
# fixes (Nov 2026). Options/crypto strategies stay off.
enabled = [
  "equity_momentum",
]
allow_options = true
allow_crypto = true
allow_short = true
min_signal_score = 70.0
max_option_entry_orders_per_underlying_per_day = 1
option_loss_cooldown_minutes = 1440
# Initial swing stop = 3 x ATR14, clamped to 3-12% of price (sets position size;
# the 2.5-ATR trail is tighter from the first day).
atr_period = 14
atr_stop_multiple = 3.0
min_stop_pct = 3.0
max_stop_pct = 12.0
# Decide swing entries in the last hour before the close (until the 10-minute
# close buffer), when the daily bar the signals use is nearly final. Matches
# the backtest's entry-at-close assumption.
swing_entry_window_minutes = 60

[screener]
enabled = true
max_candidates = 10
# No crypto strategy is enabled, so crypto screener slots only crowded out equities.
max_crypto_candidates = 0
universes = ["nasdaq100", "sp500_core", "crypto_major"]
min_price = 5.0
min_avg_dollar_volume = 25000000.0
max_realized_volatility_pct = 90.0
min_trend_score = 45.0

[catalyst]
enabled = true
min_trade_score = 65.0
min_entry_score = 80.0
score_weight = 0.35
max_volatility_pct = 75.0
generate_entry_candidates = false
block_low_confidence = true
block_rumor_only = true
block_high_event_risk = true
require_medium_confidence_for_options = true

[day_trading]
enabled = true
paper_only = true
max_trades_per_day = 3
risk_per_trade_pct = 0.25
# Position cap raised 4 -> 8: sizing is cap-bound, so actual per-trade dollar risk
# was only ~13% of the risk_per_trade budget. Still cap-bound at 8%.
max_position_pct = 8.0
max_daily_loss_pct = 1.0
max_position_minutes = 480
force_exit_before_close_minutes = 15
min_catalyst_score = 65.0
min_intraday_score = 70.0
min_combined_score = 75.0
exit_intraday_score = 45.0
# The intraday-score exit fired on routine dips below VWAP and cut trades before
# the ADR target/floor resolved; disabling it improved both backtest halves
# (PF 0.84 -> 0.91). Day trading overall showed NO robust edge (PF ~1.0,
# t ~0 on 224 backtest trades) - keep it paper-only and do not scale it up.
intraday_score_exit_enabled = false
# Breakouts count only in the first 2 hours; no new entries in the last 90 minutes.
orb_valid_minutes = 120
last_entry_minutes_before_close = 90
# stop/take_profit are caps on the ADR-derived floor/ceiling. Raised so the caps
# only bind on genuinely high-ADR names (a 1.0% floor on a 5% ADR stock is a
# noise-stop at 0.2 ADR).
stop_loss_pct = 1.5
take_profit_pct = 3.0
trailing_stop_pct = 1.0
ceiling_adr_fraction = 0.55
floor_adr_fraction = 0.40
# Partial scale-out DISABLED (partial_exit_size = 0): in a 75-session minute-bar
# backtest (Nov 2026, 224 trades) it lowered the result in both halves of the sample
# (PF 0.91 -> 1.00 when removed). The code path stays for future testing.
partial_exit_adr_fraction = 0.45
partial_exit_max_pct = 1.0
partial_exit_size = 0
profit_protect_pct = 0
profit_trail_pct = 0
stale_negative_minutes = 0
time_decay_minutes = 0
min_relative_volume = 1.2
max_spread_pct = 1.5

# Setups with weak realized expectancy trade at reduced size until proven
# (opening_range_break: 33% win rate, ~$0 net over 9 trades as of Jul 2026).
[day_trading.setup_risk_multipliers]
opening_range_break = 0.5

[research]
news_headline_limit = 8
news_cache_enabled = true
news_cache_database_path = "data/news_cache.sqlite3"
news_cache_ttl_seconds = 1800
marketaux_daily_call_limit = 90
alpaca_news_daily_call_limit = 0
yahoo_news_daily_call_limit = 0
sec_companyfacts_enabled = true
crypto_research_enabled = true
crypto_onchain_enabled = false
crypto_onchain_provider = ""
crypto_exchange_flows_enabled = false
